<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Клиент на ремонте</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #e8f4f8;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }
    .container {
        background: #fff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 90%;
    }
    .icon {
        font-size: 60px;
        margin-bottom: 20px;
    }
    h1 {
        color: #2b70b8;
        margin-top: 0;
        font-size: 28px;
    }
    p {
        font-size: 16px;
        color: #555;
        line-height: 1.5;
        margin-bottom: 25px;
    }
    .btn {
        display: inline-block;
        background: #2b70b8;
        color: #fff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: bold;
        transition: background 0.2s;
    }
    .btn:hover {
        background: #1a4f85;
    }
    .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #999;
    }
</style>
</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>Клиент временно на ремонте</h1>
    <p>
        Мы обновляем наш мини-клиент, чтобы сделать его ещё быстрее и удобнее. 
        Скоро вернёмся в строй!
    </p>
    <p>
        А пока вы можете читать и публиковать посты в стандартных клиентах, например:
    </p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <a href="https://golos.id" class="btn" target="_blank">Golos.id</a>
        <a href="https://golos.today" class="btn" target="_blank">Golos.today</a>
        <a href="https://golos.in" class="btn" target="_blank">Golos.in</a>
    </div>
    
    <div class="footer">
        Спасибо за понимание!<br>
    </div>
</div>

</body>
</html>
